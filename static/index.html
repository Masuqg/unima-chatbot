<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unima — AI Chatbot</title>
<style>
  :root {
    --bg: #070b16;
    --card: rgba(15, 20, 40, .72);
    --stroke: rgba(255, 255, 255, .09);
    --text: #eef1ff;
    --muted: #8b93b8;
    --g1: #6366f1;   /* indigo  */
    --g2: #a855f7;   /* purple  */
    --g3: #14b8a6;   /* teal    */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* ---- floating background orbs ---- */
  .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5;
         animation: float 16s ease-in-out infinite; pointer-events: none; }
  .orb.a { width: 420px; height: 420px; background: #4f46e5; top: -120px; left: -120px; }
  .orb.b { width: 360px; height: 360px; background: #9333ea; bottom: -140px; right: -100px; animation-delay: -6s; }
  .orb.c { width: 280px; height: 280px; background: var(--g3); bottom: 8%; left: 6%; opacity: .3; animation-delay: -3s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(40px,-30px) scale(1.08); }
    66%     { transform: translate(-30px,25px) scale(.95); }
  }

  /* ---- glass chat card ---- */
  .card {
    position: relative; width: min(780px, 94vw); height: min(88vh, 900px);
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--stroke); border-radius: 24px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55); overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 13px; padding: 15px 20px;
    border-bottom: 1px solid var(--stroke); background: rgba(255,255,255,.03);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 14px; flex: none;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(99,102,241,.45);
  }
  header h1 { font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399;
         display: inline-block; margin-right: 6px; animation: pulse 1.8s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,.5); }
    50%     { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
  }
  .badge {
    margin-left: auto; font-size: 11px; padding: 5px 12px; border-radius: 999px;
    background: rgba(245,158,11,.12); color: #fbbf24; border: 1px solid rgba(245,158,11,.35);
  }
  .badge.ai { background: rgba(16,185,129,.12); color: #4ade80; border-color: rgba(34,197,94,.35); }

  /* ---- messages ---- */
  #chat {
    flex: 1; overflow-y: auto; padding: 22px;
    display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
  .msg {
    max-width: 78%; padding: 12px 16px; border-radius: 18px;
    line-height: 1.55; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
    animation: pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; } }
  .msg.user {
    align-self: flex-end; border-bottom-right-radius: 6px;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    box-shadow: 0 8px 20px rgba(139,92,246,.30);
  }
  .msg.bot  { align-self: flex-start; border-bottom-left-radius: 6px;
              background: rgba(255,255,255,.06); border: 1px solid var(--stroke); }
  .msg.error { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); }
  .msg .time { display: block; font-size: 10.5px; opacity: .55; margin-top: 6px; text-align: right; }

  /* blinking caret shown while a reply is streaming in */
  .body.streaming::after { content: "▍"; opacity: .75; animation: blink .9s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* typing indicator */
  .typing { display: inline-flex; gap: 5px; padding: 15px 17px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%;
                 background: linear-gradient(135deg, var(--g1), var(--g2));
                 animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.4; }
                      30% { transform: translateY(-5px); opacity:1; } }

  /* ---- welcome hero + suggestion chips ---- */
  .hero { margin: auto; text-align: center; color: var(--muted); padding: 10px 20px; }
  .hero .logo {
    width: 74px; height: 74px; border-radius: 22px; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px rgba(139,92,246,.4);
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .hero h2 { color: var(--text); font-size: 22px; font-weight: 650; margin-bottom: 6px; }
  .hero p { font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
  .chip {
    padding: 9px 15px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--stroke); background: rgba(255,255,255,.05); color: var(--text);
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--g1);
                box-shadow: 0 6px 16px rgba(99,102,241,.3); }

  /* ---- composer ---- */
  #composer {
    display: flex; gap: 10px; padding: 14px 16px;
    border-top: 1px solid var(--stroke); background: rgba(255,255,255,.03);
  }
  #input {
    flex: 1; resize: none; max-height: 120px; padding: 13px 16px;
    border-radius: 14px; border: 1px solid var(--stroke);
    background: rgba(7,11,22,.6); color: var(--text);
    font-size: 14.5px; font-family: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #input:focus { border-color: var(--g1); box-shadow: 0 0 0 4px rgba(99,102,241,.18); }
  button { border: none; cursor: pointer; font-family: inherit; }
  #send {
    width: 46px; height: 46px; border-radius: 14px; flex: none; align-self: flex-end;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(99,102,241,.4);
    transition: transform .15s, filter .15s;
  }
  #send:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.12); }
  #send svg { width: 19px; height: 19px; fill: #fff; }
  #clear {
    align-self: flex-end; padding: 0 6px; height: 46px;
    background: transparent; color: var(--muted); font-size: 13px;
    transition: color .15s;
  }
  #clear:hover { color: var(--text); }

  footer {
    text-align: center; font-size: 11px; color: var(--muted);
    padding: 8px; border-top: 1px solid var(--stroke); background: rgba(255,255,255,.02);
  }

  @media (max-width: 600px) {
    .card { width: 100vw; height: 100vh; border-radius: 0; }
    .orb { opacity: .35; }
  }
</style>
</head>
<body>

<div class="orb a"></div>
<div class="orb b"></div>
<div class="orb c"></div>

<main class="card">
  <header>
    <div class="avatar">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <rect x="5" y="8.5" width="14" height="9.5" rx="4"/>
        <circle cx="9.8" cy="13.2" r="1.1" fill="#fff" stroke="none"/>
        <circle cx="14.2" cy="13.2" r="1.1" fill="#fff" stroke="none"/>
        <path d="M12 8.5V5.2"/><circle cx="12" cy="4" r="1.2"/>
        <path d="M3 12.5v2M21 12.5v2"/>
      </svg>
    </div>
    <div>
      <h1>Unima</h1>
      <div class="status"><span class="dot"></span><span id="status">connecting…</span></div>
    </div>
    <span class="badge" id="badge">…</span>
  </header>

  <div id="chat">
    <div class="hero" id="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="8.5" width="14" height="9.5" rx="4"/>
          <circle cx="9.8" cy="13.2" r="1.1" fill="#fff" stroke="none"/>
          <circle cx="14.2" cy="13.2" r="1.1" fill="#fff" stroke="none"/>
          <path d="M12 8.5V5.2"/><circle cx="12" cy="4" r="1.2"/>
          <path d="M3 12.5v2M21 12.5v2"/>
        </svg>
      </div>
      <h2>Hi, I'm Unima ✨</h2>
      <p>Your AI assistant — ask me anything, or try a suggestion:</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div id="composer">
    <button id="clear" title="Clear conversation">Clear</button>
    <textarea id="input" rows="1" placeholder="Message Unima…  (Enter to send)"></textarea>
    <button id="send" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <footer>Unima · built with Flask + a free LLM API · internship project</footer>
</main>

<script>
const chat   = document.getElementById('chat');
const hero   = document.getElementById('hero');
const input  = document.getElementById('input');
const badge  = document.getElementById('badge');
const statusEl = document.getElementById('status');

// Suggestion chips — click one and it is sent immediately.
const SUGGESTIONS = [
  'What can you do?',
  'Tell me a joke',
  'Explain how this chatbot works',
  'Give me internship tips'
];
const chipsBox = document.getElementById('chips');
SUGGESTIONS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = s;
  b.onclick = () => { input.value = s; send(); };
  chipsBox.appendChild(b);
});

// Conversation history — sent to the backend with every message.
let history = [];

fetch('/api/health').then(r => r.json()).then(cfg => {
  if (cfg.mode === 'ai') {
    badge.textContent = 'AI · ' + cfg.model;
    badge.classList.add('ai');
    statusEl.textContent = 'online · powered by a real LLM';
  } else {
    badge.textContent = 'DEMO MODE';
    statusEl.textContent = 'online · demo mode (add API key for real AI)';
  }
}).catch(() => {
  badge.textContent = 'OFFLINE';
  statusEl.textContent = 'backend not reachable — is app.py running?';
});

function stamp() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function removeHero() { if (hero && hero.parentNode) hero.remove(); }

function makeBubble(role) {
  removeHero();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const body = document.createElement('span');
  body.className = 'body';
  div.appendChild(body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return { bubble: div, body };
}

function addTime(bubble) {
  const t = document.createElement('span');
  t.className = 'time';
  t.textContent = stamp();
  bubble.appendChild(t);
}

function addMsg(role, text) {
  const { bubble, body } = makeBubble(role);
  body.textContent = text;
  addTime(bubble);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  removeHero();
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { document.getElementById('typing')?.remove(); }

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    // Streaming endpoint: the reply arrives chunk-by-chunk over one open connection.
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    if (!res.ok) {   // errors are returned as JSON before the stream starts
      const data = await res.json().catch(() => ({}));
      hideTyping();
      addMsg('bot error', '⚠️ ' + (data.error || ('HTTP ' + res.status)));
      return;
    }

    // Read the stream token-by-token into a live bubble.
    hideTyping();
    const { bubble, body } = makeBubble('bot');
    body.classList.add('streaming');           // blinking caret
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      full += decoder.decode(value, { stream: true });
      body.textContent = full;
      chat.scrollTop = chat.scrollHeight;
    }

    body.classList.remove('streaming');
    addTime(bubble);
    history.push({ role: 'assistant', content: full });
  } catch (e) {
    hideTyping();
    addMsg('bot error', '⚠️ Could not reach the server. Is app.py running?');
  }
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('clear').addEventListener('click', () => {
  history = []; chat.innerHTML = '';
  addMsg('bot', 'Fresh start ✨ What would you like to talk about?');
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {           // auto-grow textarea
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.focus();
</script>

</html>
